# Development Environment Configuration

environment: dev

api:
  base_url: http://localhost:8000
  timeout: 30
  verify_ssl: false
  retry_times: 2

auth:
  type: custom
  script_path: ./libs/auth_handler.py

logging:
  level: DEBUG
  file: logs/dev.log
  console: true

data:
  storage: yaml
  path: ./data/test_data.yaml
  auto_cleanup: true

reporting:
  type: allure
  output_dir: ./reports/
  allure_results_dir: ./reports/allure-results/
